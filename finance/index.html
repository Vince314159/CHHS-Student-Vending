<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f9fd" />
  <meta name="description" content="Vending Finance Board — receipts, machine performance, funding, and repayments." />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>Vending Finance Board</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-wrap">
        <div class="avatar-mark" aria-hidden="true"><img src="icon.svg" alt="" /></div>
        <div>
          <p class="eyebrow">VENDING FINANCE</p>
          <h1 id="pageTitle">Home</h1>
        </div>
      </div>
      <button class="icon-btn" id="exportBtn" title="Export data" aria-label="Export data">⇩</button>
    </header>

    <main id="appMain" class="content" tabindex="-1"></main>

    <nav class="bottom-nav" aria-label="Primary navigation">
      <button class="nav-item active" data-page="home"><span class="nav-icon">⌂</span><span>Home</span></button>
      <button class="nav-item" data-page="receipts"><span class="nav-icon">▤</span><span>Receipts</span></button>
      <button class="nav-item" data-page="machines"><span class="nav-icon">▣</span><span>Machines</span></button>
      <button class="nav-item" data-page="funding"><span class="nav-icon">$</span><span>Funding</span></button>
    </nav>
  </div>

  <dialog id="modal" class="modal">
    <form method="dialog" class="modal-card" id="modalCard">
      <div class="modal-header">
        <div>
          <p class="eyebrow" id="modalEyebrow">ADD RECORD</p>
          <h2 id="modalTitle">New entry</h2>
        </div>
        <button class="icon-btn small" value="cancel" aria-label="Close">×</button>
      </div>
      <div id="modalBody"></div>
    </form>
  </dialog>

  <input id="importInput" type="file" accept="application/json" hidden />
  <script src="app.js"></script>
</body>
</html>
