<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f9fd" />
  <meta name="description" content="CHHS vending finance board — earnings, monthly expenses, and machine performance." />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>Vending Finance Board</title>
  <link rel="stylesheet" href="styles.css?v=month-archive-v2" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-wrap">
        <div class="avatar-mark" aria-hidden="true"><img src="icon.svg" alt="" /></div>
        <div>
          <p class="eyebrow">VENDING FINANCE</p>
          <h1 id="pageTitle">Home</h1>
        </div>
      </div>
      <div class="display-chip" title="ChatGPT manages shared data; quick entries save in your browser">CHAT + QUICK ENTRY</div>
    </header>

    <div id="dataNotice" class="sync-notice" role="status" aria-live="polite"></div>
    <main id="appMain" class="content" tabindex="-1"></main>

    <nav class="bottom-nav" aria-label="Finance board views">
      <button type="button" class="nav-item active" data-page="home"><span class="nav-icon">⌂</span><span>Home</span></button>
      <button type="button" class="nav-item" data-page="receipts"><span class="nav-icon">▤</span><span>Receipts</span></button>
      <button type="button" class="nav-item" data-page="machines"><span class="nav-icon">▣</span><span>Machines</span></button>
      <button type="button" class="nav-item" data-page="funding"><span class="nav-icon">$</span><span>Funding</span></button>
      <button type="button" class="nav-item" data-page="monthly"><span class="nav-icon">▥</span><span>Monthly Expenses</span></button>
      <button type="button" class="nav-item" data-page="months"><span class="nav-icon">◷</span><span>Months</span></button>
    </nav>
  </div>
  <script src="months.js?v=month-archive-v2"></script>
  <script src="app.js?v=month-archive-v2"></script>
</body>
</html>
